name: "CodeQL"

on: [push,pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: cpp
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4.39.3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: +security-extended
        config-file: ${{ matrix.language == 'cpp' && './.github/codeql/cpp.yml' || '' }}

    - name: Build app
      if: matrix.language == 'cpp'
      run: |
        sudo apt-get update && sudo apt-get install -y libglib2.0-dev man jq libgtk-3-dev
        FORCE_CFLAGS="-std=gnu17" ./configure --with-werror
        nproc && make -j$(nproc)
      env:
        DEBIAN_FRONTEND: noninteractive

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.39.3
      with:
        category: "/language:${{matrix.language}}"
