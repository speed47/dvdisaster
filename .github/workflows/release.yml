name: autobuild

on:
  push:
    branches:
      - 'master'
      - 'dev'
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    permissions:
      contents: write
    strategy:
      matrix:
        ui: [cli, gui]
        arch: [x86_64, arm64]
        include:
          - ui: cli
            clionly: --with-gui=no
          - arch: x86_64
            runs-on: macos-15-intel
          - arch: arm64
            runs-on: macos-15
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install prerequisites
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install flock gdk-pixbuf dylibbundler create-dmg # glib => already installed
      - name: install prerequisites (GUI)
        if: matrix.ui == 'gui'
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install gtk+3 adwaita-icon-theme
      - name: configure
        run: |
          set +x
          ./configure ${{ matrix.clionly }} --with-werror
      - name: make
        run: |
          cat Makefile.config
          make -j$(sysctl -n hw.ncpu || echo 2)
      - name: check executability
        run: ./dvdisaster --version
      - name: check executable (GUI)
        if: matrix.ui == 'gui'
        run: |
          ./dvdisaster --version
          if ./dvdisaster --version | grep NOGUI; then exit 1; fi
      - name: check executable (CLI)
        if: matrix.ui == 'cli'
        run: |
          ./dvdisaster --version
          ./dvdisaster --version | grep NOGUI
      - name: build dist
        run: ./.github/workflows/make-mac-app.sh ${{ github.ref }} ${{ matrix.arch }}
        id: dist
        timeout-minutes: 4
      - name: launch the app
        run: |
          set -x
          hdiutil attach ${{ steps.dist.outputs.archive }}
          cd /Volumes/dvdisaster*/dvdisaster.app
          open ./Contents/MacOS/dvdisaster
      - name: screenshot the desktop
        run: |
          screencapture -T 15 -x screenshot.png
      - name: upload screenshot
        uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-${{ matrix.arch }}-${{ matrix.ui }}.zip
          path: screenshot.png
      - name: Tag for Continuous Build
        if: github.ref_name == 'master'
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Upload to Continuous Build
        if: github.ref_name == 'master'
        uses: softprops/action-gh-release@v3.0.4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: true
          name: "Continuous Build"
          tag_name: latest
          files: ${{ steps.dist.outputs.archive }}
      - name: Tag for Dev Build
        if: github.ref_name == 'dev'
        run: |
          git tag -f devel
          git push -f origin devel
      - name: Upload to Dev Build
        if: github.ref_name == 'dev'
        uses: softprops/action-gh-release@v3.0.4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: true
          draft: true
          name: "Dev Build"
          tag_name: devel
          files: ${{ steps.dist.outputs.archive }}
      - name: Upload to Draft Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3.0.4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.dist.outputs.archive }}

  win:
    permissions:
      contents: write
    runs-on: windows-latest
    strategy:
      matrix:
        ui: [cli, gui]
        include:
          - ui: cli
            clionly: --with-gui=no
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: git diffutils make pkg-config mingw-w64-ucrt-x86_64-glib2 mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-ntldd man zip
      - name: install GUI prereqs
        if: matrix.ui == 'gui'
        run: pacman -S --noconfirm mingw-w64-ucrt-x86_64-gtk3 mingw-w64-ucrt-x86_64-librsvg
      - name: git config
        run: git config --global core.autocrlf input
        shell: bash
      - uses: actions/checkout@v7.0.1
      - name: configure
        run: ./configure ${{ matrix.clionly }}
      - name: make
        run: nproc && make -j$(nproc)
      - name: check executable
        run: |
          ./dvdisaster.exe --version
          file dvdisaster.exe
          if ./dvdisaster.exe --version | grep dirty; then exit 1; fi
          file dvdisaster.exe | grep -q 'x86-64'
          file dvdisaster.exe | grep -q 'for MS Windows'
      - name: check executable (GUI)
        if: matrix.ui == 'gui'
        run: if ./dvdisaster.exe --version | grep NOGUI; then exit 1; fi
      - name: check executable (CLI)
        if: matrix.ui == 'cli'
        run: ./dvdisaster.exe --version | grep NOGUI
      - name: prepare dist
        run: ./.github/workflows/make-dist.sh ${{ github.ref }}
        id: dist
      - name: check executability of dist from cmd.exe
        shell: cmd
        run: |
          cd dist
          dvdisaster.exe --version
          dvdisaster --version
      - name: Tag for Continuous Build
        if: github.ref_name == 'master'
        shell: pwsh
        timeout-minutes: 2
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Upload to Continuous Build
        if: github.ref_name == 'master'
        uses: softprops/action-gh-release@v3.0.4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: true
          name: "Continuous Build"
          tag_name: latest
          files: ${{ steps.dist.outputs.archive }}
      - name: Tag for Dev Build
        if: github.ref_name == 'dev'
        shell: pwsh
        timeout-minutes: 2
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          git tag -f devel
          git push -f origin devel
      - name: Upload to Dev Build
        if: github.ref_name == 'dev'
        uses: softprops/action-gh-release@v3.0.4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: true
          draft: true
          name: "Dev Build"
          tag_name: devel
          files: ${{ steps.dist.outputs.archive }}
      - name: Upload to Draft Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3.0.4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.dist.outputs.archive }}

  linux64-cli:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: install prerequisites
        run: sudo apt update && sudo apt install -y libglib2.0-dev man
      - name: configure
        run: ./configure --with-gui=no
      - name: make
        run: |
          nproc && make -j$(nproc)
          glib_static_libs=$(pkg-config --static --libs glib-2.0)
          make static GLIB_LIBS="$glib_static_libs"
          mv -f dvdisaster-static dvdisaster
      - name: check executable
        run: |
          ./dvdisaster --version && ./dvdisaster --version | grep -q dirty || true
          file dvdisaster && file dvdisaster | grep -q 'ELF 64' && file dvdisaster | grep -q 'statically linked'

      - name: build dist
        run: ./.github/workflows/make-dist.sh ${{ github.ref }}
        id: dist
      - name: Tag for Continuous Build
        if: github.ref_name == 'master'
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Upload to Continuous Build
        if: github.ref_name == 'master'
        uses: softprops/action-gh-release@v3.0.4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: true
          name: "Continuous Build"
          tag_name: latest
          files: ${{ steps.dist.outputs.archive }}
      - name: Tag for Dev Build
        if: github.ref_name == 'dev'
        run: |
          git tag -f devel
          git push -f origin devel
      - name: Upload to Dev Build
        if: github.ref_name == 'dev'
        uses: softprops/action-gh-release@v3.0.4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: true
          draft: true
          name: "Dev Build"
          tag_name: devel
          files: ${{ steps.dist.outputs.archive }}
      - name: Upload to Draft Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3.0.4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.dist.outputs.archive }}

  linux64-appimage:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # The image and quick-sharun are pinned; see .github/WORKFLOWS.md before changing them.
      - name: docker
        run: docker run --name uu -d -v $PWD:/dvdisaster ubuntu:24.04@sha256:9c7f200c07e3d4a03e7249d2c16bf66a51120fb876aa2242cf31451412543289 sleep 1800
      - name: install quick-sharun in docker
        run: |
          docker exec uu sh -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl'
          docker exec uu sh -c 'curl -fsSL -o /usr/local/bin/quick-sharun https://raw.githubusercontent.com/pkgforge-dev/Anylinux-AppImages/8c077af41a60aa1368a0926427a98927de300a87/useful-tools/quick-sharun.sh && echo "a7994d3bd3debf72b67a131b17f061cc312dc1461e4d083d9607d2ca5af41d8b  /usr/local/bin/quick-sharun" | sha256sum -c - && chmod 755 /usr/local/bin/quick-sharun'
      - name: build and install dvdisaster in docker
        run: docker exec uu sh -c 'cd /dvdisaster && sh contrib/anylinux/get-dependencies.sh'
      - name: build appimage in docker with quick-sharun
        run: docker exec -e OUTPUT_VERSION="${GITHUB_REF##*/}" uu sh -c 'cd /dvdisaster && sh contrib/anylinux/make-appimage.sh'
      - name: fix perms
        run: docker exec uu sh -c "chown -R $UID /dvdisaster/dist"
      - name: test appimage
        id: dist
        run: |
          chmod 755 dist/dvdisaster*.AppImage && ./dist/dvdisaster*.AppImage --version
          archive=$(ls -1 dist/dvdisaster*.AppImage)
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "appimage is <$archive>"
      # glibc 2.23: older than what the former linuxdeploy AppImage could start on
      - name: test appimage on an old distro
        run: docker run --rm -v $PWD/dist:/dist:ro ubuntu:16.04@sha256:1f1a2d56de1d604801a9671f301190704c25d604a416f59e03c04f5c6ffee0d6 sh -c 'cp /dist/dvdisaster*.AppImage /tmp/dv && chmod 755 /tmp/dv && /tmp/dv --version'
      - name: Tag for Continuous Build
        if: github.ref_name == 'master'
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Upload to Continuous Build
        if: github.ref_name == 'master'
        uses: softprops/action-gh-release@v3.0.4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: true
          name: "Continuous Build"
          tag_name: latest
          files: ${{ steps.dist.outputs.archive }}
      - name: Tag for Dev Build
        if: github.ref_name == 'dev'
        run: |
          git tag -f devel
          git push -f origin devel
      - name: Upload to Dev Build
        if: github.ref_name == 'dev'
        uses: softprops/action-gh-release@v3.0.4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: true
          draft: true
          name: "Dev Build"
          tag_name: devel
          files: ${{ steps.dist.outputs.archive }}
      - name: Upload to Draft Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3.0.4
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.dist.outputs.archive }}
